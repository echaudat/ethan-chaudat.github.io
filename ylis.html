<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vol avec moi 🐉</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --sky:#08131f;
    --night:#050914;
    --dragon:#193f45;
    --mint:#9fe3d4;
    --fire:#ff8b4d;
    --cream:#f6ebd5;
    --gold:#d9b36c;
}


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    min-height:100vh;

    background:
    radial-gradient(circle at 50% 0%,rgba(159,227,212,.15),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(255,139,77,.12),transparent 30%),
    linear-gradient(#091725,#050914);

    color:white;
    font-family:Inter,sans-serif;
    overflow-x:hidden;
}


/* ciel */

.stars{
    position:fixed;
    inset:0;
    background-image:
    radial-gradient(#fff 1px,transparent 1px);
    background-size:80px 80px;
    opacity:.25;
    animation:stars 80s linear infinite;
}


@keyframes stars{
    from{background-position:0 0}
    to{background-position:-500px 500px}
}



/* lune */

.moon{

    position:fixed;
    right:8%;
    top:10%;

    width:100px;
    height:100px;

    border-radius:50%;

    background:#fff2c9;

    box-shadow:
    0 0 80px rgba(255,240,200,.5);

}



/* contenu */

main{

    position:relative;
    z-index:2;

    max-width:600px;
    margin:auto;

    padding:70px 20px;

    text-align:center;

}


/* petit titre */

.badge{

    display:inline-block;

    padding:8px 18px;

    border-radius:999px;

    background:rgba(159,227,212,.1);

    border:1px solid rgba(159,227,212,.25);

    color:var(--mint);

    font-size:12px;

    letter-spacing:2px;

}



/* dragon */

.dragon{

    width:280px;
    margin:35px auto;

    animation:float 4s ease-in-out infinite;

}



@keyframes float{

    50%{
        transform:translateY(-12px);
    }

}


.dragon svg{

    width:100%;

    filter:
    drop-shadow(0 20px 30px rgba(0,0,0,.5));

}



/* titre */

h1{

    font-family:Cinzel,serif;

    font-size:clamp(2rem,6vw,3rem);

    line-height:1.2;

}


h1 span{

    color:var(--fire);

}



.subtitle{

    margin:20px auto 35px;

    max-width:450px;

    color:#c9c5b7;

    line-height:1.7;

}



/* carte */


.card{


    background:
    linear-gradient(
    145deg,
    rgba(255,255,255,.08),
    rgba(255,255,255,.02)
    );


    backdrop-filter:blur(15px);


    border:

    1px solid rgba(255,255,255,.12);


    border-radius:28px;


    padding:30px;



    box-shadow:
    0 30px 80px rgba(0,0,0,.4);

}




label{

    display:block;

    text-align:left;

    font-size:12px;

    letter-spacing:2px;

    color:var(--mint);

    margin-bottom:8px;

}



input{

    width:100%;

    padding:15px;

    margin-bottom:20px;


    background:#07111c;


    border-radius:14px;

    border:1px solid rgba(255,255,255,.15);


    color:white;

    font-size:15px;

}


input:focus{

    outline:none;

    border-color:var(--fire);

}





.buttons{

    display:flex;

    justify-content:center;

    gap:15px;

}



button{


    padding:15px 25px;

    border-radius:999px;

    border:none;

    cursor:pointer;

    font-weight:700;

    transition:.25s;

}



.yes{

    background:linear-gradient(135deg,#ff9a55,#ff6533);

    color:white;

    box-shadow:
    0 10px 30px rgba(255,120,50,.4);

}



.yes:hover{

    transform:scale(1.05);

}



.no{

    background:rgba(255,255,255,.08);

    color:#ddd;

}




/* résultat */


#success{

    display:none;

}


.scroll{


    margin-top:30px;

    padding:25px;


    background:#101a24;


    border-radius:20px;

    border:1px solid rgba(255,255,255,.1);

}


.row{

    display:flex;

    justify-content:space-between;

    padding:12px 0;

    border-bottom:1px solid rgba(255,255,255,.08);

}


.row:last-child{

    border:none;

}



.label{

    color:var(--mint);

}



.value{

    font-weight:bold;

}



/* flammes */


.spark{

position:fixed;

bottom:-20px;

width:6px;

height:6px;

background:#ff8b4d;

border-radius:50%;

animation:rise 5s linear forwards;

}



@keyframes rise{

to{

transform:
translateY(-110vh)
translateX(50px);

opacity:0;

}

}





@media(max-width:500px){

.buttons{

flex-direction:column;

}

.dragon{

width:220px;

}

}



</style>

</head>


<body>


<div class="stars"></div>

<div class="moon"></div>



<main>


<div class="badge">
MESSAGE DE BERK • MISSION DRAGON
</div>



<div class="dragon">


<svg viewBox="0 0 300 220">

<!-- ailes -->

<path d="M70 110 Q20 40 80 35 Q110 80 130 100"
fill="#193f45"/>


<path d="M230 110 Q280 40 220 35 Q190 80 170 100"
fill="#193f45"/>


<!-- corps -->

<ellipse cx="150" cy="120" rx="55" ry="70"
fill="#204b52"/>


<!-- oreilles -->

<path d="M110 60 L90 30 L130 45Z"
fill="#193f45"/>


<path d="M190 60 L210 30 L170 45Z"
fill="#193f45"/>


<!-- yeux -->

<circle cx="130" cy="105" r="8"
fill="#9fe3d4"/>

<circle cx="170" cy="105" r="8"
fill="#9fe3d4"/>


<!-- sourire -->

<path d="M125 140 Q150 160 175 140"
stroke="#ff8b4d"
stroke-width="5"
fill="none"
stroke-linecap="round"/>


</svg>


</div>



<h1>
Tu viens voler avec moi, <span>Ylis</span> ?
</h1>


<p class="subtitle">

Une petite aventure façon Berk.
Un lieu, une date, une heure…
et on laisse le dragon choisir le chemin.

</p>




<div class="card">


<input id="lieu" placeholder="📍 Où part-on ?">


<input id="date" type="date">


<input id="heure" type="time">



<div class="buttons">


<button class="yes" onclick="confirmDate()">

🐉 Oui, je monte

</button>


<button class="no" id="no">

Pas cette fois

</button>


</div>


</div>




<div id="success">


<h1>
Vol confirmé 🔥
</h1>


<div class="scroll">


<div class="row">

<span class="label">Lieu</span>

<span class="value" id="oLieu"></span>

</div>


<div class="row">

<span class="label">Date</span>

<span class="value" id="oDate"></span>

</div>


<div class="row">

<span class="label">Heure</span>

<span class="value" id="oHeure"></span>

</div>


</div>


</div>



</main>



<script>


const no=document.querySelector("#no");


no.addEventListener("mouseover",()=>{

no.style.transform=
`translate(${Math.random()*200-100}px,
${Math.random()*80-40}px)`;

});


function confirmDate(){


let lieu=document.querySelector("#lieu").value;
let date=document.querySelector("#date").value;
let heure=document.querySelector("#heure").value;


if(!lieu||!date||!heure){

alert("Le dragon attend encore les informations 🐉");

return;

}



document.querySelector("#oLieu").innerHTML=lieu;

document.querySelector("#oDate").innerHTML=
new Date(date)
.toLocaleDateString("fr-FR",
{
weekday:"long",
day:"numeric",
month:"long"
});


document.querySelector("#oHeure").innerHTML=heure;



document.querySelector(".card").style.display="none";

document.querySelector("#success").style.display="block";


for(let i=0;i<40;i++){

setTimeout(()=>{


let s=document.createElement("div");

s.className="spark";

s.style.left=Math.random()*100+"vw";

s.style.animationDuration=
3+Math.random()*3+"s";


document.body.appendChild(s);


setTimeout(()=>s.remove(),5000);


},i*80);


}


}



</script>


</body>
</html>
